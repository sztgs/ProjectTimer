<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Theme Editor</title>
  <link rel="stylesheet" href="./editor.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1>Theme Editor</h1>
      <div class="field">
        <label for="themeName">Theme name</label>
        <input id="themeName" type="text" value="bios">
      </div>
      <div class="field">
        <label for="themeDisplayName">Display name</label>
        <input id="themeDisplayName" type="text" value="Custom Theme">
      </div>
      <div class="field">
        <label for="themeWidth">Resolution (width x height)</label>
        <div class="inline">
          <input id="themeWidth" type="number" value="1920" min="200">
          <input id="themeHeight" type="number" value="480" min="200">
        </div>
      </div>
      <div class="field">
        <label for="themeBackground">Background</label>
        <input id="themeBackground" type="text" value="#000000">
      </div>
      <div class="buttons">
        <button id="loadTheme">Load theme</button>
        <button id="saveLayout">Download layout.json</button>
        <button id="createTheme">Download theme pack</button>
      </div>
      <div class="field">
        <label for="pluginType">Add plugin</label>
        <select id="pluginType"></select>
        <button id="addPlugin">Add</button>
      </div>
      <h2>Plugins</h2>
      <ul id="pluginList" class="plugin-list"></ul>
      <h2>Selected plugin</h2>
      <div class="field">
        <label for="pluginJson">Config (JSON)</label>
        <textarea id="pluginJson" rows="12"></textarea>
        <div class="buttons">
          <button id="applyPlugin">Apply config</button>
          <button id="deletePlugin">Delete plugin</button>
          <button id="duplicatePlugin">Duplicate</button>
          <button id="toggleVisibility">Toggle visibility</button>
        </div>
      </div>
      <div class="field">
        <label for="shapeType">Shape type</label>
        <select id="shapeType">
          <option value="rect">Rectangle</option>
          <option value="roundedRect">Rounded rectangle</option>
          <option value="circle">Circle</option>
          <option value="triangle">Triangle</option>
          <option value="polygon">Polygon</option>
        </select>
      </div>
      <div class="field">
        <label for="shapeSides">Polygon sides</label>
        <input id="shapeSides" type="number" value="6" min="3" max="12">
      </div>
      <div class="field">
        <label for="rotation">Rotation (degrees)</label>
        <input id="rotation" type="number" value="0" step="5">
      </div>
      <div class="field">
        <label for="colorPicker">Primary color</label>
        <input id="colorPicker" type="color" value="#00ff66">
      </div>
      <div class="field">
        <label for="alphaRange">Opacity</label>
        <input id="alphaRange" type="range" min="0" max="1" step="0.05" value="1">
      </div>
      <div class="field">
        <label for="textEditor">ASCII/Text content</label>
        <textarea id="textEditor" rows="6" placeholder="Select a text plugin to edit"></textarea>
      </div>
      <div class="buttons">
        <button id="layerUp">Move layer up</button>
        <button id="layerDown">Move layer down</button>
      </div>
      <div class="field">
        <label>Canvas helpers</label>
        <div class="inline">
          <label class="checkbox">
            <input id="showGrid" type="checkbox" checked>
            Show grid
          </label>
          <label class="checkbox">
            <input id="snapGrid" type="checkbox" checked>
            Snap to grid
          </label>
        </div>
        <input id="gridSize" type="number" value="20" min="4" step="2">
      </div>
      <div class="field">
        <label for="styleEditor">Theme style.css</label>
        <textarea id="styleEditor" rows="8" placeholder="Load a theme to edit CSS animations"></textarea>
        <button id="downloadStyle">Download style.css</button>
      </div>
      <div class="field">
        <label for="stylePreset">Style preset</label>
        <select id="stylePreset"></select>
        <button id="applyStylePreset">Apply preset</button>
      </div>
      <div class="field">
        <label for="animationPreset">Animation preset</label>
        <select id="animationPreset"></select>
        <button id="addAnimationPreset">Add animation</button>
      </div>
      <p class="hint">Tip: drag items to reposition and drag the corner handle to resize.</p>
    </aside>
    <main class="stage">
      <canvas id="screen"></canvas>
      <div class="overlay" id="overlay">
        <div class="resize-handle"></div>
      </div>
    </main>
  </div>
  <script type="module" src="./editor.js"></script>
</body>
</html>
