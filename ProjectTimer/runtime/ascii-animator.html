<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ASCII Animation Lab</title>
  <link rel="stylesheet" href="./ascii-animator.css">
</head>
<body>
  <div class="lab">
    <aside class="panel">
      <h1>ASCII Animation Lab</h1>
      <label for="frames">Frames (one per line)</label>
      <textarea id="frames" rows="10">|\
/\
-\
\\</textarea>
      <label for="speed">Frame Speed (ms)</label>
      <input id="speed" type="number" value="120" min="30" step="10">
      <label for="color">Color</label>
      <input id="color" type="color" value="#00ff66">
      <label for="fontSize">Font Size</label>
      <input id="fontSize" type="number" value="24" min="8">
      <button id="copyConfig">Copy Plugin Config</button>
      <pre id="configOut"></pre>
    </aside>
    <main class="preview">
      <canvas id="screen" width="400" height="200"></canvas>
    </main>
  </div>
  <script type="module" src="./ascii-animator.js"></script>
</body>
</html>
