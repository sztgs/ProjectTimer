<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Project Timer</title>
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>Project Timer</h1>
      <div class="controls">
        <label for="themeSelect">Theme</label>
        <select id="themeSelect"></select>
        <button id="applyTheme">Apply</button>
        <button id="openRuntime">Open Timer</button>
        <button id="openEditor">Open Editor</button>
        <button id="openStudio">Studio</button>
        <button id="openAsciiLab">ASCII Animator</button>
      </div>
    </header>
    <main class="content">
      <section class="theme-panel">
        <h2>Theme Library</h2>
        <div id="themeGrid" class="theme-grid"></div>
      </section>
      <iframe id="preview" title="Timer preview"></iframe>
    </main>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
