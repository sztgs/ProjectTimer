<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Theme Editor (Experimental)</title>
  <link rel="stylesheet" href="./editor.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">Project Timer Studio (Experimental)</div>
      <nav class="toolbar">
        <button data-action="theme">Theme Manager</button>
        <button data-action="legacy">Legacy Editor</button>
        <button data-action="save">Save Layout</button>
      </nav>
    </header>
    <aside class="sidebar left">
      <h2>Tools</h2>
      <button>Move</button>
      <button>Scale</button>
      <button>Rotate</button>
      <button>Shape</button>
      <button>Text</button>
      <button>Media</button>
      <button>Animation</button>
    </aside>
    <main class="viewport">
      <div class="viewport-header">
        <span>Viewport</span>
        <div class="viewport-actions">
          <button data-action="timer">Timer</button>
          <button data-action="editor">Editor</button>
        </div>
      </div>
      <iframe id="stage" title="Theme editor viewport" src="./editor_legacy.html"></iframe>
    </main>
    <aside class="sidebar right">
      <h2>Properties</h2>
      <section class="panel">
        <h3>Transform</h3>
        <div class="row">
          <label>X</label><input type="number" value="0">
          <label>Y</label><input type="number" value="0">
        </div>
        <div class="row">
          <label>W</label><input type="number" value="320">
          <label>H</label><input type="number" value="180">
        </div>
        <div class="row">
          <label>Rot</label><input type="number" value="0">
        </div>
      </section>
      <section class="panel">
        <h3>Layers</h3>
        <ul class="layers">
          <li>Background</li>
          <li>Clock</li>
          <li>Media</li>
        </ul>
      </section>
    </aside>
    <section class="timeline">
      <div class="timeline-header">Timeline</div>
      <div class="timeline-body">Experimental animation timeline.</div>
    </section>
  </div>
  <script type="module" src="./editor.js"></script>
</body>
</html>
